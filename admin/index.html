<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administración del sitio | Regulatorio Telecomunicaciones</title>
</head>
<body>
  <p style="margin:0;padding:12px 20px;background:#0b172b;color:#fff;font:600 14px Arial,sans-serif">
    <a href="/admin/knowledge.html" style="color:#b7f36b">Administrar documentos del asistente regulatorio ↗</a>
  </p>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            window.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
